<script>
'use strict';
const icons={bus:'<rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 11h14M8 19v2M16 19v2M9 6h6"/><circle cx="8" cy="15" r=".7"/><circle cx="16" cy="15" r=".7"/>',range:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',confidence:'<path d="M4 20V15h3v5M10 20V10h3v10M16 20V4h3v16"/>',requests:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',decision:'<path d="M12 3v18M12 5h7l3 3-3 3h-7M12 13H5l-3 3 3 3h7"/>',guide:'<path d="M8 3h8v3H8zM6 5H4v16h16V5h-2M8 11h8M8 15h8M8 18h5"/>',home:'<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',check:'<path d="m5 12 4 4 10-10"/>',access:'<circle cx="12" cy="4" r="2"/><path d="M5 8h14M12 6v8M12 14l-4 7M12 14l4 7"/>',pet:'<circle cx="8" cy="7" r="2"/><circle cx="16" cy="7" r="2"/><circle cx="4" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/><path d="M7 19c-4-3 1-8 5-8s9 5 5 8c-2 2-3 0-5 0s-3 2-5 0Z"/>',walk:'<circle cx="13" cy="3" r="2"/><path d="m7 10 5-4 4 5 4 1M12 7l-2 8-4 6M10 15l5 2 1 4"/>',water:'<path d="M12 3c-2 4-7 8-7 12a7 7 0 0 0 14 0c0-4-5-8-7-12Z"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.bus}</svg>`;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenes={stable:{name:'Stable arrival',range:[3,5],confidence:'High',likely:4,message:'The arrival estimate is relatively stable.',advice:'Stay near the stop. Your bus may arrive soon.'},uncertain:{name:'Uncertain arrival',range:[6,12],confidence:'Low',likely:9,message:'The arrival estimate may change.',advice:'Keep an eye on the display and compare alternatives if timing matters.'},delayed:{name:'Significant delay',range:[15,25],confidence:'Low',likely:20,message:'The bus is delayed. The estimate may change further.',advice:'Compare another bus or walking before deciding to keep waiting.'},comparisonB:{name:'Comparison range · 4–9 min',range:[4,9],confidence:'Low',likely:6,message:'This is an uncertain arrival estimate.',advice:'Stay within sight of the stop while you wait.'},comparisonC:{name:'Comparison range · 2–10 min',range:[2,10],confidence:'Low',likely:6,message:'This estimate has a wide arrival window.',advice:'The bus could arrive in 2 minutes. Avoid leaving the stop.'}};
const features=[{id:'eta',name:'ETA Range',icon:'range',desc:'When could your bus arrive?'},{id:'confidence',name:'Confidence',icon:'confidence',desc:'Understand prediction reliability'},{id:'requests',name:'Passenger Requests',icon:'requests',desc:'Check support and onboard information'},{id:'decision',name:'Decision Support',icon:'decision',desc:'Compare your ways to get there'},{id:'guide',name:'Waiting Guide',icon:'guide',desc:'Make a plan while you wait'}];
const requests=[{id:'access',name:'Wheelchair space',icon:'access',desc:'Check space availability and request boarding support.',result:'Wheelchair-space availability is not confirmed in this scenario. Your simulated boarding-support request has been recorded; it does not reserve a space.'},{id:'seat',name:'Priority seating',icon:'requests',desc:'Ask about seating and assistance with boarding.',result:'A priority seat cannot be guaranteed. Your simulated seating-assistance request has been recorded; it does not reserve a seat.'},{id:'pet',name:'Pets onboard',icon:'pet',desc:'Check pet information before you board.',result:'No verified pet-presence information is available in this scenario. Your simulated enquiry has been recorded. Do not assume the vehicle is pet-free or allergen-free.'}];
const tasks=[{title:'Find the arrival window',prompt:'You are waiting for Bus 412 to Central Station. Use this display to find when the bus could arrive. Tell me what you think the time means.',observe:'Finds ETA; distinguishes a range from a guaranteed countdown.',scene:'Stable · 3–5 min'},{title:'Assess reliability',prompt:'You have an appointment soon. Find out how reliable the arrival estimate is and tell me how that would affect your plans.',observe:'Finds confidence; explains uncertainty in their own words.',scene:'Uncertain · 6–12 min'},{title:'Respond to a delay',prompt:'The arrival information has now changed. Find out what changed and tell me what you would do next.',observe:'Notices new range and delay; understands it is an update.',scene:'Change to Delayed · 15–25 min during task'},{title:'Ask for passenger support',prompt:'You are travelling with someone who uses a wheelchair. Use the display to ask about space or boarding support. Tell me what the response does and does not confirm.',observe:'Chooses support; confirms request; understands no space is guaranteed.',scene:'Any scene'},{title:'Choose a journey option',prompt:'You need to reach Central Station within 30 minutes. Compare the available options and choose how you would travel. Explain your choice.',observe:'Compares total journey times, chooses a plan, understands uncertainty.',scene:'Delayed · 15–25 min'}];
const defaults={scene:'uncertain',variants:{eta:'A',confidence:'C',requests:'C',decision:'B',guide:'B'},guide:true,previousRange:null,updatedAt:null};
let cfg=JSON.parse(JSON.stringify(defaults));
try{const c=JSON.parse(localStorage.getItem('waitwise-config')||'null');if(c){if(scenes[c.scene])cfg.scene=c.scene;if(Array.isArray(c.previousRange))cfg.previousRange=c.previousRange;if(c.updatedAt)cfg.updatedAt=c.updatedAt;for(const f of features){if(['A','B','C'].includes(c.variants?.[f.id]))cfg.variants[f.id]=c.variants[f.id];}if(typeof c.guide==='boolean')cfg.guide=c.guide;}}catch{}
const facilitator=new URLSearchParams(location.search).get('mode')==='facilitator'||/facilitator/i.test(location.pathname);
const passengerURL=(location.pathname||'').includes('WaitWise_Facilitator')?'WaitWise_Offline.html':facilitator?'index.html':'?';
const offlineURL='index.html';
let passengerPreview=false;
let view='home',tab='controls',selectedRequest=null,requestStage='select',selectedJourney=null,selectedBus='412',journeyDone=false,deadline=30,sessionNumber=1;
let record={participant:'',facilitator:'',notes:'',tasks:tasks.map(()=>({outcome:'Not assessed',help:'',note:''})),preference:'',confidencePreference:'',decisionPreference:'',guidePreference:''};
let events=[];let channel;try{channel=new BroadcastChannel('waitwise-control');channel.onmessage=e=>{if(e.data?.type==='reset'){clearPassenger();render();toast('Ready for the next passenger.');}else receiveConfig(e.data);};}catch{}
function receiveConfig(c){if(!c||!scenes[c.scene])return;cfg=c;selectedJourney=null;selectedBus='412';journeyDone=false;render();toast('Arrival information updated.');}
window.addEventListener('storage',e=>{if(e.key==='waitwise-reset'){clearPassenger();render();}if(e.key==='waitwise-config'){try{receiveConfig(JSON.parse(e.newValue));}catch{}}});
function saveConfig(){try{localStorage.setItem('waitwise-config',JSON.stringify(cfg));}catch{}try{channel?.postMessage(cfg);}catch{}}
function scene(){return scenes[cfg.scene];}function rangeText(){return scene().range.join('–');}function updateStatus(){return cfg.updatedAt?'Demo scenario updated at '+new Date(cfg.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Demo scenario · no live transport feed';}function previousStatus(){return cfg.previousRange&&cfg.previousRange.join('–')!==rangeText()?'Previous demo estimate '+cfg.previousRange.join('–')+' min → now '+rangeText()+' min. ':'';}
function log(action,detail){events.push({time:new Date().toISOString(),session:sessionNumber,action,detail:detail||'',scene:cfg.scene});}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').textContent='',4200);}
function go(id){view=id;log('open',id);render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('main h1')?.focus({preventScroll:true});}
function clearPassenger(){selectedRequest=null;requestStage='select';selectedJourney=null;selectedBus='412';journeyDone=false;deadline=30;view='home';sessionNumber++;}
function endSession(){log('end_session');clearPassenger();render();toast('Session ended. Ready for the next passenger.');}
function route(){return `<div class="route">${svg('bus')}<span class="route-number">412</span><div><small>Destination</small><strong>Central Station</strong></div><div class="stop"><small>QR code at</small><strong>University Stop · Demo</strong></div></div>`;}
function busChooser(){const s=scene(),current=selectedBus==='412';return `<section class="bus-select" aria-label="Bus routes to Central Station"><div class="section-line"><h2>Choose a bus to compare</h2><small>Both reach Central Station · Demo</small></div><div class="bus-select-grid"><button class="bus-choice" data-bus="412" aria-pressed="${current}"><strong>Bus 412</strong><small>At University Stop · your current stop</small><span>${rangeText()} min until arrival</span></button><button class="bus-choice" data-bus="422" aria-pressed="${!current}"><strong>Bus 422</strong><small>Nearby stop · 4 min walk from here</small><span>5–9 min wait after the walk</span></button></div><div class="bus-focus"><strong>${current?'Bus 412 · '+(s.range[0]+15)+'–'+(s.range[1]+15)+' min total':'Bus 422 · 27–31 min total'}</strong><p>${current?s.range[0]+'–'+s.range[1]+' min wait at this stop + 15 min ride. '+s.confidence+' prediction reliability.':'Walk 4 min to a nearby stop + wait 5–9 min there + 18 min ride. This is a different stop.'}</p><button class="btn small" data-action="compare-selected-bus">Compare this route with other options ${svg('arrow')}</button></div><p class="bus-disclaimer">All arrival and journey times are simulated. Choosing a bus here does not book it.</p></section>`;}
function pageHead(title,subtitle){return `<div class="page-head"><div><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div><button class="btn secondary" data-action="home">${svg('home')} Home</button></div>`;}
function confidenceBadge(){return `<span class="badge ${scene().confidence==='Low'?'warn':''}">${scene().confidence} confidence</span>`;}
function rangeVisual(variant){const s=scene();const labels=`<div class="eta-labels"><span><strong>${s.range[0]} min</strong>Earliest</span><span><strong>${s.likely} min</strong>Illustrative midpoint</span><span><strong>${s.range[1]} min</strong>Latest</span></div>`;const visual=variant==='A'?`<div class="eta-visual"><div class="eta-axis"><i class="dot"></i><i class="dot middle"></i><i class="dot"></i></div>${labels}</div>`:variant==='B'?`<div class="eta-visual"><div class="eta-axis band"><i class="dot middle"></i></div>${labels}</div>`:`<div class="eta-visual"><div class="eta-vertical"><div class="eta-vrow"><strong>${s.range[0]} min</strong>Earliest arrival</div><div class="eta-vrow middle"><strong>${s.likely} min</strong>Illustrative midpoint arrival</div><div class="eta-vrow"><strong>${s.range[1]} min</strong>Latest arrival</div></div></div>`;return `<div class="main-reading"><span class="eyebrow">Estimated bus arrival</span><div class="big-number">${rangeText()} <span>min</span></div>${confidenceBadge()}${visual}<p class="variant-intro">A time window, not a guarantee. Midpoint is illustrative; data are simulated.</p></div>`;}
function home(){return `<section class="hero"><div><h1 tabindex="-1">Your journey,<br>your choice.</h1><p>Read uncertainty. Compare options. Make your next move.</p></div><div class="hero-symbol">${svg('bus')}</div></section>${busChooser()}<div class="qr-context"><strong>Opened from this stop’s QR code</strong><p>This is a phone-based classroom demo. No new bus-stop touchscreen is needed; all arrival and request information is simulated.</p></div><div class="update-strip"><strong>${previousStatus()||"Bus 412 demo estimate: "+rangeText()+" min"}</strong><span>${updateStatus()}</span></div><div class="section-line"><h2>Explore Bus 412 details</h2><small>Tap a card to explore</small></div><div class="grid">${features.slice(0,4).map((f,i)=>`<button class="tile" data-page="${f.id}"><div class="tile-top"><span class="icon-box">${svg(f.icon)}</span><span class="tile-num">0${i+1}</span></div><h3>${f.name}</h3><p>${f.desc}</p>${i===2?'':`<div class="tile-value ${i>0?'word':''}">${[rangeText()+' min',scene().confidence+' reliability','','Your options'][i]}</div>`}<span class="arrow">${svg('arrow')}</span></button>`).join('')}</div>${cfg.guide?`<button class="tile guide-tile" data-page="guide"><span class="icon-box">${svg('guide')}</span><div><h3>05 · Waiting Guide</h3><p>Simple suggestions for your wait</p></div><span class="arrow">${svg('arrow')}</span></button>`:''}`;}
function eta(){return `${pageHead('01 · ETA Range','Bus 412 · Arrival at this stop')}${route()}<section class="panel" style="margin-top:18px">${rangeVisual(cfg.variants.eta)}<div class="update-strip"><strong>${previousStatus()||"Current demo arrival window"}</strong><span>${updateStatus()}</span></div><div class="note"><strong>${scene().message}</strong><br>${cfg.scene==='delayed'?"Cause of delay: not available in this simulation.<br>":""}The bus may arrive between ${scene().range[0]} and ${scene().range[1]} minutes from now. This window can change; ${scene().range[1]} minutes is not a guaranteed maximum.</div><div class="info-result"><h3>While you wait</h3><p>${scene().advice}</p></div><div class="actions"><button class="btn" data-page="decision">Compare travel options ${svg('arrow')}</button><button class="btn secondary" data-page="confidence">Check confidence</button></div></section>`;}
function confidenceVisual(variant){const s=scene(),low=s.confidence==='Low';const visual=variant==='A'?`<div class="confidence-visual"><div class="conf-segments"><i class="active"></i><i class="${low?'':'active'}"></i><i class="${low?'':'active'}"></i></div><div class="conf-labels"><span>Low</span><span>Medium</span><span>High</span></div></div>`:variant==='B'?`<div class="confidence-visual"><div class="conf-scale"><i style="left:${low?'15%':'85%'}"></i></div><div class="conf-labels"><span>Low</span><span>Medium</span><span>High</span></div></div>`:`<div class="confidence-visual"><div class="conf-dial"><i class="conf-needle" style="transform:rotate(${low?'155deg':'25deg'})"></i></div><div class="conf-labels"><span>Low</span><span>Prediction reliability</span><span>High</span></div></div>`;return `<div class="main-reading ${variant==='C'?'option-c':''}"><span class="eyebrow">Prediction reliability</span><div class="big-number" style="font-size:54px">${s.confidence}</div>${visual}<p class="conf-caption">${low?'The ETA may change as traffic conditions change.':'The ETA is relatively stable, but it is not guaranteed.'}</p></div>`;}
function confidence(){const s=scene(),v=cfg.variants.confidence,low=s.confidence==='Low',[a,b]=s.range;const primaryTotal=(a+15)+'–'+(b+15);const message=low?(cfg.scene==='delayed'?'Bus 412 now takes about '+primaryTotal+' min total in this demo. Bus 422 may take 27–31 min, including the walk to its stop. Compare both routes and walking before deciding whether to leave this stop.':'Bus 412 could take '+primaryTotal+' min total, but its arrival window may move again. Compare Bus 422 and walking against your deadline before leaving this stop.'):'Bus 412 currently takes about '+primaryTotal+' min total in this demo, compared with 27–31 min for Bus 422. Staying near this stop may make sense if that meets your deadline; keep watching for changes.';return `${pageHead('02 · Prediction reliability','Bus 412 · How stable is this ETA estimate?')}<section class="panel">${confidenceVisual(v)}<div class="note"><strong>${low?'Low: this estimate could move later or earlier.':'High: this estimate appears relatively stable in this demo.'}</strong><br>Reliability refers only to the Bus 412 arrival prediction. It says nothing about seats, wheelchair space or safety. This classroom label is simulated, not a measured probability.</div><div class="plan-cue ${low?'low':''}"><h3>${low?'If timing matters, compare before leaving':'Your next step'}</h3><p>${message}</p><div class="route-snapshot"><div><strong>Bus 412 · ${primaryTotal} min total</strong><span>${a}–${b} min wait + 15 min ride · ${s.confidence} reliability</span></div><div><strong>Bus 422 · 27–31 min total</strong><span>4 min walk + 5–9 min wait + 18 min ride · nearby stop</span></div></div></div><div class="actions"><button class="btn" data-page="decision">Compare both buses and walking ${svg('arrow')}</button><button class="btn secondary" data-page="eta">View Bus 412 ETA</button></div></section>`;}
function requestPage(){const r=requests.find(x=>x.id===selectedRequest),v='C';if(requestStage==='done'&&r)return `${pageHead('03 · Passenger Requests','Boarding support and information')}<section class="panel success"><div class="circle">${svg('check')}</div><h2>Demo selection saved on this phone</h2><p><strong>${r.name}</strong></p><p>${r.result}</p><div class="request-warning"><strong>No help has been arranged.</strong>This demo does not send your selection to a driver or operator, reserve a place, or confirm boarding support. For actual travel, use the transport provider’s official accessibility information and assistance channels.</div><div class="actions" style="justify-content:center"><button class="btn" data-action="new-request">Make another request</button><button class="btn secondary" data-action="home">Return home</button></div></section>`;
if(requestStage==='confirm'&&r)return `${pageHead('03 · Confirm your request','Check before submitting')}<section class="panel"><span class="icon-box">${svg(r.icon)}</span><h2 style="margin-top:18px">${r.name}</h2><p>${r.desc}</p><div class="request-warning"><strong>Before continuing</strong>This classroom demo saves a selection on this phone only. It does not contact a driver or operator, reserve wheelchair space or seating, or arrange assistance.</div><div class="actions"><button class="btn" data-action="submit-request">Confirm request ${svg('check')}</button><button class="btn secondary" data-action="back-request">Change request</button></div></section>`;
return `${pageHead('03 · Passenger Requests','Check support and onboard information')}<section class="panel"><p class="variant-intro">Explore a possible request flow. This classroom demo does not send requests to anyone.</p><div class="${v==='C'?'option-list':'choice-grid'}">${requests.map(q=>v==='C'?`<button class="option" data-request="${q.id}" aria-pressed="${selectedRequest===q.id}"><span class="icon-box">${svg(q.icon)}</span><span class="option-copy"><strong>${q.name}</strong><small>${q.desc}</small></span>${svg('arrow')}</button>`:`<button class="choice" data-request="${q.id}" aria-pressed="${selectedRequest===q.id}">${svg(q.icon)}<strong>${q.name}</strong>${v==='B'?`<small>${q.desc}</small>`:''}</button>`).join('')}</div><div class="note">No availability is verified. No driver or operator receives your selection; do not rely on this screen for real boarding needs.</div><div class="actions"><button class="btn" data-action="confirm-request" ${!r?'disabled':''}>Review request ${svg('arrow')}</button></div></section>`;}
function journeyOptions(){const [a,b]=scene().range;return [{id:'wait',name:'Wait for Bus 412',icon:'bus',min:a+15,max:b+15,detail:`${a}–${b} min wait + 15 min ride`,parts:[`${a}–${b} min wait`,'15 min ride']},{id:'walk',name:'Walk to Central Station',icon:'walk',min:28,max:28,detail:'28 min walk · No bus wait',parts:['28 min walk']},{id:'alternative',name:'Take alternative Bus 422',icon:'bus',min:27,max:31,detail:'4 min walk + 5–9 min wait + 18 min ride',parts:['4 min walk','5–9 min wait','18 min ride']}];}
function decisionCompareVisual(v){const opts=journeyOptions();return `<div class="concept-preview">${v==='C'?`<table class="compact-table"><thead><tr><th>Option</th><th>Total</th></tr></thead><tbody>${opts.map(o=>`<tr><td><strong>${o.name}</strong><br><small>${o.detail}</small></td><td>${o.min===o.max?o.min:o.min+'–'+o.max} min</td></tr>`).join('')}</tbody></table>`:`<div class="option-list">${opts.map(o=>`<div class="option"><span class="icon-box">${svg(o.icon)}</span><span class="option-copy"><strong>${o.name}</strong><small>${o.detail}</small>${v==='B'?`<span class="timeline">${o.parts.map(p=>`<span>${p}</span>`).join('')}</span>`:''}</span><span class="option-time">${o.min===o.max?o.min:o.min+'–'+o.max}<small>min</small></span></div>`).join('')}</div>`}</div>`;}
function guideCompareVisual(v){const tips=[{icon:'eye',title:'Stay aware',text:scene().advice},{icon:'water',title:'Water or a snack?',text:'Stay close enough to notice an update.'},{icon:'decision',title:'Have a backup',text:'Compare total journey times.'},{icon:'access',title:'Need support?',text:'Ask before the bus arrives.'}];return `<div class="concept-preview">${v==='A'?`<div class="info-result" style="margin-top:0"><h3>${rangeText()} min · Current window</h3><p>${scene().advice}</p></div><ul class="list">${tips.slice(1).map(t=>`<li><strong>${t.title}</strong> ${t.text}</li>`).join('')}</ul>`:v==='B'?`<div class="tip-grid">${tips.map(t=>`<div class="tip">${svg(t.icon)}<h3>${t.title}</h3><p>${t.text}</p></div>`).join('')}</div>`:`<h3>Your waiting checklist</h3>${tips.map(t=>`<label class="check"><input type="checkbox" disabled><strong>${t.title}</strong> ${t.text}</label>`).join('')}`}</div>`;}
function fits(o){if(o.max<=deadline)return 'Within your time limit, based on demo estimates';if(o.min<=deadline)return 'Could fit, but the estimate also exceeds your limit';return 'Exceeds your time limit, based on demo estimates';}
function decision(){const opts=journeyOptions(),chosen=opts.find(x=>x.id===selectedJourney),v=cfg.variants.decision;if(journeyDone&&chosen)return `${pageHead('04 · Your travel choice','A plan for your next step')}<section class="panel success"><div class="circle">${svg('check')}</div><h2>${chosen.name}</h2><p>Estimated time to destination: <strong>${chosen.min===chosen.max?chosen.min:chosen.min+'–'+chosen.max} minutes</strong>.</p><p>${chosen.detail}</p><p>${fits(chosen)}.</p><div class="note">This records your choice only. It does not book travel, send directions or guarantee an arrival time.</div><div class="actions" style="justify-content:center"><button class="btn secondary" data-action="change-journey">Compare again</button><button class="btn" data-action="end">End session</button></div></section>`;
return `${pageHead('04 · Decision Support','Compare total time to Central Station')}<section class="panel"><div class="deadline"><label for="deadline">I need to arrive within</label><input id="deadline" type="number" min="5" max="180" value="${deadline}" inputmode="numeric"><span>minutes</span></div>${v==='C'?`<div class="scroll-table"><table class="compact-table"><thead><tr><th>Option</th><th>Journey breakdown</th><th>Total</th><th>Select</th></tr></thead><tbody>${opts.map(o=>`<tr><td><strong>${o.name}</strong></td><td>${o.detail}</td><td>${o.min===o.max?o.min:o.min+'–'+o.max} min</td><td><button class="btn ${selectedJourney===o.id?'':'secondary'} small" data-journey="${o.id}" aria-pressed="${selectedJourney===o.id}">${selectedJourney===o.id?'Selected':'Select'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="option-list">${opts.map(o=>`<button class="option" data-journey="${o.id}" aria-pressed="${selectedJourney===o.id}"><span class="icon-box">${svg(o.icon)}</span><span class="option-copy"><strong>${o.name}</strong><small>${o.detail}</small>${v==='B'?`<span class="timeline">${o.parts.map(p=>`<span>${p}</span>`).join('')}</span>`:''}</span><span class="option-time">${o.min===o.max?o.min:o.min+'–'+o.max}<small>min total</small></span></button>`).join('')}</div>`}${chosen?`<div class="info-result"><h3>${chosen.name}</h3><p>${fits(chosen)}.</p></div>`:''}<div class="note">All times are illustrative. Total time includes waiting and travel. Estimates can change; choose based on your needs.</div><div class="actions"><button class="btn" data-action="choose-journey" ${!chosen?'disabled':''}>Choose this option ${svg('arrow')}</button></div></section>`;}
function guide(){const v=cfg.variants.guide;const tips=[{icon:'eye',title:'Stay aware',text:scene().advice},{icon:'water',title:'Water or a snack?',text:'Only consider a nearby shop if someone can watch for your bus. Even a long estimate can change.'},{icon:'decision',title:'Have a backup',text:'Compare total journey times if you need to arrive by a deadline.'},{icon:'access',title:'Need support?',text:'Ask about boarding support before the bus arrives. Availability is not guaranteed.'}];return `${pageHead('05 · Waiting Guide','Small suggestions, based on the current estimate')}<section class="panel">${v==='A'?`<div class="info-result" style="margin-top:0"><h3>${rangeText()} min · Current arrival window</h3><p>${scene().advice}</p></div><ul class="list">${tips.slice(1).map(t=>`<li><strong>${t.title}</strong> ${t.text}</li>`).join('')}</ul>`:v==='B'?`<div class="tip-grid">${tips.map(t=>`<div class="tip">${svg(t.icon)}<h3>${t.title}</h3><p>${t.text}</p></div>`).join('')}</div>`:`<h2>Your waiting checklist</h2>${tips.map((t,i)=>`<label class="check"><input type="checkbox" data-guide="${i}"><strong>${t.title}</strong> ${t.text}</label>`).join('')}`}<div class="actions"><button class="btn" data-page="decision">Compare travel options</button><button class="btn secondary" data-action="home">Return home</button></div></section>`;}
function controls(){return `<div class="statusline">Controls affect this browser only. A second tab on this device can receive scenario changes. A phone on another device will not receive facilitator changes in this classroom simulation.</div><div class="fac-grid"><section class="panel"><h2>Test scenario</h2><div class="form-field"><label for="scene">Arrival situation</label><select id="scene">${Object.entries(scenes).map(([id,s])=>`<option value="${id}" ${cfg.scene===id?'selected':''}>${s.name} · ${s.range.join('–')} min</option>`).join('')}</select></div><div class="pill-row"><span class="pill">${rangeText()} min</span><span class="pill">${scene().confidence} confidence</span><span class="pill">15 min ride</span></div><p class="variant-intro">Changes keep ETA, confidence, advice and total journey time consistent.</p><div class="actions"><button class="btn" data-action="passenger">Open passenger view</button><a class="btn secondary" href="${passengerURL}" target="_blank" rel="noopener">Open separate tab</a><button class="btn secondary" data-action="reset">Reset passenger</button></div></section><section class="panel"><h2>Presentation variants</h2><p class="variant-intro">ETA and Confidence have three controlled visual alternatives. Passenger Requests uses one complete design.</p>${features.filter(f=>f.id!=='requests').map(f=>`<div class="variant-line"><label for="variant-${f.id}">${f.name}</label><select id="variant-${f.id}" data-variant="${f.id}">${['A','B','C'].map(v=>`<option ${cfg.variants[f.id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<label class="check"><input id="show-guide" type="checkbox" ${cfg.guide?'checked':''}> Show optional fifth feature: Waiting Guide</label><button class="btn soft small" data-tab="comparison">Compare ETA + Confidence</button></section></div><section class="panel" style="margin-top:18px"><h2>Test-day checklist</h2><ul class="list"><li>Ask the tutor for feedback on the stop-QR-to-phone journey and whether the information supports real decisions.</li><li>Use the printed stop QR sign to explain the entry point. Run scene-change tasks in two tabs of the same browser; changes do not sync to another device.</li><li>Prepare at least five tasks and a consistent English script.</li><li>Print the course consent form; prepare observation sheets and SUS if used.</li><li>Each of the five members facilitates and records at least one complete session.</li><li>Each member also participates in another group’s test.</li></ul></section>`;}
function plan(){return `<section class="panel"><h2>User testing & evaluation plan</h2><div class="summary-row"><strong>Prototype</strong><span>WAITWISE · stop QR to phone prototype</span></div><div class="summary-row"><strong>Description</strong><span>A printed stop QR opens a phone interface for simulated arrivals, passenger request flow and travel choices.</span></div><div class="summary-row"><strong>Participants</strong><span>Students unfamiliar with this concept; record relevant bus-use experience without collecting diagnoses.</span></div><div class="summary-row"><strong>Method</strong><span>Moderated English think-aloud; observe behaviour, then ask neutral follow-up questions.</span></div><div class="summary-row"><strong>Logistics</strong><span>Plan 12–15 minutes per session and confirm the venue and current course schedule.</span></div><div class="summary-row"><strong>Goals</strong><span>Assess discoverability, range/confidence comprehension, request-feedback understanding and journey comparison.</span></div><h2 style="margin-top:25px">Five core tasks</h2>${tasks.map((t,i)=>`<div class="task"><h3>${i+1}. ${t.title}</h3><p><strong>Read aloud:</strong> ${t.prompt}</p><p><strong>Set scenario:</strong> ${t.scene}</p><p><strong>Observe:</strong> ${t.observe}</p></div>`).join('')}<div class="note">These are proposed tasks, not course-provided wording. Use identical core tasks for all sessions. Optional preference comparison comes afterwards, so it does not coach participants before the usability test.</div><div class="actions"><button class="btn secondary" data-print="plan">Print plan + task sheet</button></div></section>`;}
function script(){return `<section class="panel"><h2>English facilitator script</h2><h3>1. Consent before recording</h3><div class="script"><p>“Thank you for joining. We are testing a prototype, not your ability. Taking part is voluntary. You may skip a question or stop at any time. With your permission, we will record this session for our course assessment. Please read the consent form and let me know if you have any questions.”</p></div><p>Use the course form. Obtain consent before starting the recording. Do not record a participant who declines.</p><h3>2. Introduce the scenario</h3><div class="script"><p>“Imagine you are at a bus stop, waiting for Bus 412 to Central Station. You have scanned a QR code at the stop and opened a phone view. The transport information is simulated. Please use it as you normally would and say aloud what you notice, expect and think.”</p></div><p>Do not demonstrate the four features first. Give one task at a time.</p><h3>3. Neutral prompts during tasks</h3><div class="script"><p>“What are you thinking?”<br>“What would you do next?”<br>“What did you expect to happen?”</p></div><p>Allow time for exploration. If help is needed, record it. Do not name the correct button or explain the intended meaning during a task.</p><h3>4. After the five tasks</h3><div class="script"><p>“Which information was most useful? What was unclear? What did you think the request response guaranteed? Would you open a stop QR on your phone while waiting for a bus? Why or why not?”</p></div><h3>5. Optional concept comparison</h3><div class="script"><p>“Here are three ways to show the same arrival information. Before I explain them, which do you prefer at first glance? What makes you choose it?”</p></div><p>Record first preference, then explore reasons. Changing both numbers and format creates a confound; use identical data for a format comparison.</p><h3>6. Finish</h3><div class="script"><p>“Is there anything else you would change? Thank you for your feedback.”</p></div><p>Collect SUS only if it is part of your plan. Stop recording after the agreed session. Reset the prototype for the next person.</p><div class="actions"><button class="btn secondary" data-print="script">Print script</button></div></section>`;}
function comparison(){const block=(title,intro,visual,key,dataKey,note)=>`<div class="comparison-block"><h2>${title}</h2><p class="variant-intro">${intro}</p><div class="comparison">${['A','B','C'].map(v=>`<section class="comparison-card"><h3>Option ${v}</h3>${visual(v)}<button class="btn ${record[key]===v?'':'secondary'}" data-${dataKey}="${v}">${record[key]===v?'Preference recorded':'Record preference '+v}</button></section>`).join('')}</div><div class="note">${note}</div></div>`;return `<section class="panel">${block('ETA visual comparison','The time values, confidence level and explanation are identical. Only the visual representation changes.',rangeVisual,'preference','preference','<strong>A:</strong> three-point timeline. <strong>B:</strong> highlighted range. <strong>C:</strong> vertical timeline.')}${block('Confidence visual comparison','All options show the same confidence label and explanation. Only the visual representation changes.',confidenceVisual,'confidencePreference','confidence-preference','<strong>A:</strong> segmented status. <strong>B:</strong> labelled scale. <strong>C:</strong> colour-coded qualitative dial. Ask what “confidence” refers to first.')}${block('Decision Support comparison','All options use the same routes and total journey times. Only the way alternatives are organised changes.',decisionCompareVisual,'decisionPreference','decision-preference','<strong>A:</strong> simple option cards. <strong>B:</strong> cards with journey-stage chips. <strong>C:</strong> compact comparison table.')}${block('Waiting Guide comparison','All options use the same advice. Only the presentation and level of interaction changes.',guideCompareVisual,'guidePreference','guide-preference','<strong>A:</strong> priority message plus list. <strong>B:</strong> visual tip cards. <strong>C:</strong> interactive checklist.')}</section>`;}
function records(){return `<section class="panel"><h2>Session observation sheet</h2><p class="variant-intro">Fill in what actually happened. Nothing here is pre-filled as a test result. Entries are held in memory; export before closing or reloading.</p><div class="fac-grid"><div class="form-field"><label for="participant">Participant code (no name required)</label><input id="participant" value="${esc(record.participant)}" placeholder="e.g. P01"></div><div class="form-field"><label for="facilitator">Facilitator name / student ID</label><input id="facilitator" value="${esc(record.facilitator)}" placeholder="Your details"></div></div><div class="scroll-table"><table class="compact-table"><thead><tr><th>Task</th><th>Outcome</th><th>Help / hesitation</th><th>Observed behaviour / quote</th></tr></thead><tbody>${tasks.map((t,i)=>`<tr><td>${i+1}. ${t.title}</td><td><select data-record="outcome" data-index="${i}">${['Not assessed','Completed','Completed with help','Not completed','Skipped'].map(o=>`<option ${record.tasks[i].outcome===o?'selected':''}>${o}</option>`).join('')}</select></td><td><input data-record="help" data-index="${i}" value="${esc(record.tasks[i].help)}"></td><td><input data-record="note" data-index="${i}" value="${esc(record.tasks[i].note)}"></td></tr>`).join('')}</tbody></table></div><div class="form-field" style="margin-top:18px"><label for="notes">Post-test feedback / possible improvements</label><textarea id="notes">${esc(record.notes)}</textarea></div><div class="actions"><button class="btn" data-action="export">Export observation + interaction log</button><button class="btn secondary" data-print="observation">Print blank observation sheet</button><button class="btn secondary" data-action="new-record">New observation sheet</button></div><p class="empty">${events.length} interaction events in this browser session. This log supplements observation; it does not replace the required video.</p></section>`;}
function materials(){return `<div class="fac-grid"><section class="panel"><h2>Stop QR sign & test materials</h2><p>Use a printed QR code at a mock bus stop to open the phone view. The classroom screen is a test aid, not proposed new street hardware.</p><ul class="list"><li>Place the printed QR sign on a simple mock stop or display it beside the test phone.</li><li>For changing scenarios, keep passenger and facilitator tabs in the same browser on the same device.</li><li>Print the WaitWise QR sign and label the University Stop demo location.</li></ul><div class="actions"><a class="btn" href="stop-qr-sign.html" target="_blank" rel="noopener">Open printable QR sign</a></div><div class="note">A real service would need an authorised data source, security and maintenance. This prototype tests information design using simulated data.</div></section><section class="panel"><h2>Testing materials</h2><p>Use official course templates where provided. The blank forms here are working drafts, not a replacement for a required official form.</p><div class="actions"><button class="btn secondary" data-print="consent">Print draft consent checklist</button><button class="btn secondary" data-print="observation">Print observation sheet</button><button class="btn secondary" data-print="plan">Print plan + tasks</button><button class="btn secondary" data-print="script">Print English script</button></div><div class="note">Bring charged recording equipment, pens and a consent form per participant. Use the course SUS questionnaire if your plan includes SUS.</div></section></div><section class="panel" style="margin-top:18px"><h2>Part C · Group submission checklist</h2><ul class="list"><li>Group document title page.</li><li>Group testing and evaluation plan.</li><li>A section for each of the five members: named cover sheet, signed consent, actual collected data, and other-group tutorial number/group/prototype.</li><li>At least one complete end-to-end facilitation video for each member.</li><li>AI appendix describing the actual tools, prompts, uses, human checks and changes.</li></ul><h3>Suggested preparation split</h3><p>Assign ownership for interface changes, QR sign, testing script, observations and submission. Every member supplies their own test evidence.</p><div class="note"><strong>AI appendix reminder:</strong> this prototype was built with ChatGPT Work/Codex from the conversation brief and supplied images. Record your own review, any further tools used, and the edits you actually make. Do not claim user testing has occurred until it has.</div></section>`;}
function render(){document.getElementById('brand').innerHTML=svg('bus')+'WAITWISE';document.getElementById('mode-label').textContent=facilitator&&!passengerPreview&&view==='home'?'Facilitator workspace':'Stop QR · Phone view';let body='';if(facilitator&&!passengerPreview&&view==='home'){body=`<div class="fac-header"><h1 tabindex="-1">Ready for user testing.</h1><p>Scenario controls, three presentation variants and your test-day materials.</p></div><nav class="tabs" aria-label="Facilitator sections">${[['controls','Test controls'],['plan','Test plan'],['script','English script'],['comparison','Compare concepts'],['records','Observations'],['materials','Build & submit']].map(([id,label])=>`<button data-tab="${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</nav>${({controls,plan,script,comparison,records,materials}[tab]||controls)()}`;}else body=({home,eta,confidence,requests:requestPage,decision,guide}[view]||home)();document.getElementById('app').innerHTML=body;document.getElementById('footer').innerHTML=`<span>QR-linked classroom prototype · No live data, driver messages or reservations.</span><div>${view!=='home'?'<button data-action="end">End session</button>':''}${facilitator&&(passengerPreview||view!=='home')?'<button data-action="facilitator" style="margin-left:18px">Test controls</button>':facilitator?`<a href="${passengerURL}">Passenger view</a> · <a href="${offlineURL}" download>Download passenger HTML</a>`:''}</div>`;}
function download(data,name,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportRecord(){const d={prototype:'WaitWise',exported:new Date().toISOString(),config:cfg,observation:record,events,notice:'Actual observations must be entered by the team. All transport information is simulated; this file is not a video record.'};download(JSON.stringify(d,null,2),'WaitWise_'+(record.participant.replace(/[^a-zA-Z0-9_-]/g,'')||'session')+'_observations.json','application/json');toast('Observation and interaction log exported.');}
function printPage(content){return `<section class="print-page">${content}</section>`;}
function doPrint(type){let content='';if(type==='signage'){content=printPage(`<div class="print-brand">WAITWISE</div><div class="print-route">${svg('bus')}<div>Bus 412<br><small>To Central Station</small></div></div><div class="print-label"><h2>University Stop · Demo</h2><p>Scan the QR code to open WAITWISE</p></div><p class="print-note">Classroom prototype · Simulated information</p>`)+printPage(`<div class="print-label">${svg('bus')}<h1>BUS STOP</h1><h2>412</h2><p>To Central Station</p></div><div class="print-label"><h2>Waiting area</h2><p>Scan the stop QR to open the phone interface.</p></div>`);}else if(type==='plan'){content=printPage(`<h1>WaitWise · User testing plan</h1><p><strong>Concept:</strong> stop-specific QR code opening a phone prototype; optional cardboard stop model. All transport data is simulated.</p><p><strong>Goals:</strong> discoverability, range/confidence comprehension, support-feedback understanding and journey choice.</p><p><strong>Method:</strong> English moderated think-aloud. Participants: students unfamiliar with the concept. Planned duration: 12–15 minutes; confirm tutorial logistics.</p><p>Tutorial / venue: __________________ Date / time: __________________</p><p><strong>Recording and data:</strong> obtain consent first, record each facilitator’s full session, collect observations and post-test feedback. Use SUS if included in the plan.</p>${tasks.map((t,i)=>`<h2>${i+1}. ${t.title}</h2><p>${t.prompt}</p><p class="print-note">Scenario: ${t.scene}. Observe: ${t.observe}</p>`).join('')}`);}else if(type==='script'){content=printPage(`<h1>WaitWise · English facilitator script</h1><p>Obtain signed course consent before recording.</p><p>“Thank you for joining. We are testing a prototype, not your ability. Taking part is voluntary. You may skip a question or stop at any time. With your permission, we will record this session for our course assessment.”</p><p>“Imagine you are at a bus stop, waiting for Bus 412 to Central Station. You have scanned a QR code at the stop and opened a phone view. The transport information is simulated. Please use it as you normally would and say aloud what you notice, expect and think.”</p><p>Read the five tasks one at a time. Do not demonstrate the correct steps beforehand.</p><h2>Neutral prompts</h2><p>“What are you thinking?”<br>“What would you do next?”<br>“What did you expect to happen?”</p><h2>Follow-up</h2><p>“Which information was most useful? What was unclear? What did you think the request response guaranteed? Would you open a stop QR on your phone while waiting for a bus? Why or why not?”</p><h2>Optional preference comparison</h2><p>“Here are three ways to show the same arrival information. Before I explain them, which do you prefer at first glance? What makes you choose it?”</p><h2>Finish</h2><p>“Is there anything else you would change? Thank you for your feedback.”</p><p>Collect SUS if used, stop recording and reset the prototype.</p>`);}else if(type==='observation'){content=printPage(`<h1>WaitWise · Observation sheet</h1><p>Participant code: __________________ Facilitator: __________________</p><p>Date / scene / variant: __________________________________________</p><table><thead><tr><th>Task</th><th>Outcome / assistance</th><th>Behaviour / quote / hesitation</th></tr></thead><tbody>${tasks.map((t,i)=>`<tr style="height:90px"><td>${i+1}. ${t.title}</td><td></td><td></td></tr>`).join('')}</tbody></table><p>Post-test feedback: __________________________________________________</p><p>Potential changes: ____________________________________________________</p><p>Other-group tutorial / group / prototype: _______________________________</p>`);}else if(type==='consent'){content=printPage(`<h1>WaitWise · Draft consent checklist</h1><p class="print-note">Working draft only. Use the official course consent form when supplied. Complete the details below before asking for consent.</p><p>Purpose: assess a student prototype opened through a bus-stop QR code. Participation is voluntary. You may skip any task or stop at any time without penalty.</p><p>The session will involve using simulated transport information, thinking aloud and answering follow-up questions.</p><p>Recording purpose: course assessment. Recording access, storage location, retention/deletion date and withdrawal arrangements must be explained by the team before consent.</p><p>Recording access / storage: __________________________________________</p><p>Retention / deletion date: ___________________________________________</p><p>Withdrawal process / deadline: _______________________________________</p><p>Team contact: _____________________________________________________</p><p>□ I understand the session and agree to participate.</p><p>□ I agree to video/audio recording for the stated course purpose.</p><p>□ I agree to anonymised notes/quotes being used in the assessment.</p><div class="signed-line">Participant name / code:</div><div class="signed-line">Signature:</div><div class="signed-line">Date:</div><p class="print-note">If recording consent is declined, do not record; discuss an alternative with the tutor. Do not upload identifiable participant data to AI tools without appropriate permission.</p>`);}document.getElementById('print').innerHTML=content;window.print();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.tab){passengerPreview=false;tab=b.dataset.tab;view='home';render();return;}if(b.dataset.bus){selectedBus=b.dataset.bus;log('bus_inspected',selectedBus);render();return;}if(b.dataset.request){selectedRequest=b.dataset.request;log('request_selected',selectedRequest);render();return;}if(b.dataset.journey){selectedJourney=b.dataset.journey;if(selectedJourney==='wait')selectedBus='412';if(selectedJourney==='alternative')selectedBus='422';log('journey_selected',selectedJourney);render();return;}if(b.dataset.preference){record.preference=b.dataset.preference;log('eta_format_preference',record.preference);render();return;}if(b.dataset.confidencePreference){record.confidencePreference=b.dataset.confidencePreference;log('confidence_format_preference',record.confidencePreference);render();return;}if(b.dataset.print){doPrint(b.dataset.print);return;}switch(b.dataset.action){case 'home':go('home');break;case 'compare-selected-bus':selectedJourney=selectedBus==='422'?'alternative':'wait';journeyDone=false;log('compare_selected_bus',selectedBus);go('decision');break;case 'passenger':passengerPreview=true;view='home';render();break;case 'facilitator':passengerPreview=false;view='home';render();break;case 'end':endSession();break;case 'reset':clearPassenger();try{localStorage.setItem('waitwise-reset',String(Date.now()));channel?.postMessage({type:'reset'});}catch{}log('reset');render();toast('Passenger selections cleared.');break;case 'confirm-request':if(selectedRequest){requestStage='confirm';render();}break;case 'submit-request':if(selectedRequest){requestStage='done';log('request_recorded',selectedRequest);render();}break;case 'back-request':requestStage='select';render();break;case 'new-request':selectedRequest=null;requestStage='select';render();break;case 'choose-journey':if(selectedJourney){journeyDone=true;log('journey_confirmed',selectedJourney);render();}break;case 'change-journey':journeyDone=false;render();break;case 'export':exportRecord();break;case 'new-record':if(record.participant||record.facilitator||record.notes||record.tasks.some(t=>t.outcome!=='Not assessed'||t.help||t.note)){if(!window.confirm('Start a blank observation sheet? Export your current notes first if you need them.'))break;}record={participant:'',facilitator:'',notes:'',tasks:tasks.map(()=>({outcome:'Not assessed',help:'',note:''})),preference:'',confidencePreference:''};events=[];render();break;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scene'){cfg.previousRange=scene().range.slice();cfg.scene=t.value;cfg.updatedAt=new Date().toISOString();selectedJourney=null;selectedBus='412';journeyDone=false;saveConfig();log('scenario_changed',cfg.scene);render();toast('Scenario updated.');}if(t.dataset.variant){cfg.variants[t.dataset.variant]=t.value;saveConfig();log('variant_changed',t.dataset.variant+':'+t.value);}if(t.id==='show-guide'){cfg.guide=t.checked;saveConfig();}if(t.id==='deadline'){deadline=Math.max(5,Math.min(180,Number(t.value)||30));log('deadline_changed',String(deadline));render();}if(t.dataset.record){record.tasks[Number(t.dataset.index)][t.dataset.record]=t.value;}});
document.addEventListener('input',e=>{const t=e.target;if(['participant','facilitator','notes'].includes(t.id))record[t.id]=t.value;if(t.dataset.record)record.tasks[Number(t.dataset.index)][t.dataset.record]=t.value;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.decisionPreference){record.decisionPreference=b.dataset.decisionPreference;log('decision_format_preference',record.decisionPreference);render();}if(b.dataset.guidePreference){record.guidePreference=b.dataset.guidePreference;log('guide_format_preference',record.guidePreference);render();}});
window.addEventListener('beforeunload',e=>{if(record.participant||record.notes||record.tasks.some(t=>t.outcome!=='Not assessed'||t.help||t.note)){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
