<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAITWISE · University Stop QR sign</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#edf3f9;color:#153866}
.paper{max-width:640px;min-height:850px;margin:24px auto;padding:45px;background:white;border-radius:20px;text-align:center;box-shadow:0 9px 30px #1538661c}
.brand{font-size:42px;font-weight:900;color:#145cce;letter-spacing:.09em}h1{font-size:30px;line-height:1.2;margin:18px 0 8px}p{font-size:18px}img{display:block;width:300px;height:300px;margin:30px auto}
.route{background:#153866;color:#fff;border-radius:14px;padding:14px;font-weight:750;font-size:21px}.note{background:#e7f5f3;border-radius:12px;padding:16px;margin:28px auto;font-size:15px;color:#17443d}.url{font-size:13px;overflow-wrap:anywhere;color:#566b82}
button{display:block;margin:12px auto 36px;background:#145cce;color:white;border:none;border-radius:10px;padding:13px 20px;font:700 16px system-ui;cursor:pointer}

</style></head><body><main class="paper"><div class="brand">WAITWISE</div><h1>University Stop · Bus 412</h1><div class="route">To Central Station</div><p>Scan to explore your arrival window and travel choices</p><img src="waitwise-qr.svg" alt="QR code opening the WAITWISE classroom phone prototype"><p class="url">https://charlottewr.github.io/IDEA9106-WAITWISE/</p><div class="note">Classroom prototype. Arrival estimates, confidence labels and passenger requests are simulated. This is not a live transport service.</div></main><button onclick="print()">Print this sign</button></body></html>
